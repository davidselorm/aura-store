<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="goldSheen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff0c2" />
      <stop offset="35%" stop-color="#f5ba42" />
      <stop offset="70%" stop-color="#d4921f" />
      <stop offset="100%" stop-color="#8a5a0d" />
    </linearGradient>
    <linearGradient id="titaniumSheen" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7a7f8d" />
      <stop offset="50%" stop-color="#d4d7e0" />
      <stop offset="100%" stop-color="#4a4e58" />
    </linearGradient>
    <radialGradient id="slateVoid" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#151722" />
      <stop offset="100%" stop-color="#040507" />
    </radialGradient>
    <filter id="goldAura" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#f5ba42" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- Volcanic Slate Circular Housing with Diamond Cut Bevel -->
  <circle cx="32" cy="32" r="30" fill="url(#slateVoid)" stroke="url(#goldSheen)" stroke-width="1.8" />
  
  <!-- Faceted Crystalline Atelier Emblem -->
  <g filter="url(#goldAura)">
    <!-- Main Triangular Crystal Crown -->
    <polygon points="32,9 14,44 50,44" fill="none" stroke="url(#goldSheen)" stroke-width="1.6" />
    <!-- Lower Diamond Point -->
    <polygon points="14,44 32,56 50,44" fill="rgba(245, 186, 66, 0.15)" stroke="url(#goldSheen)" stroke-width="1.6" />
    <!-- Titanium Dynamic Cantilever Strut -->
    <polygon points="32,9 12,47 20,49 32,18" fill="url(#titaniumSheen)" />
    <!-- Internal Golden Facets -->
    <polygon points="32,18 48,43 32,36" fill="rgba(255, 240, 194, 0.4)" stroke="url(#goldSheen)" stroke-width="1.2" />
    <polygon points="32,36 50,44 32,56" fill="url(#goldSheen)" opacity="0.85" />
    <polygon points="32,36 14,44 32,56" fill="rgba(138, 90, 13, 0.6)" />
    <!-- Brilliant Center Specular Highlight -->
    <circle cx="32" cy="22" r="2.5" fill="#ffffff" />
  </g>
</svg>
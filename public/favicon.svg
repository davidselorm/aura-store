<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="auraGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffd166" />
      <stop offset="50%" stop-color="#ff9f1c" />
      <stop offset="100%" stop-color="#ff6b35" />
    </linearGradient>
    <linearGradient id="noirBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14151f" />
      <stop offset="100%" stop-color="#050508" />
    </linearGradient>
    <filter id="goldGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2.2" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Titanium Noir Circular Chassis -->
  <circle cx="32" cy="32" r="30" fill="url(#noirBg)" stroke="url(#auraGold)" stroke-width="2.2" />
  
  <!-- Geometric Solar Prism Core -->
  <g filter="url(#goldGlow)">
    <!-- Outer Octagon/Hexagon Matrix -->
    <polygon points="32,10 51,21 51,43 32,54 13,43 13,21" stroke="url(#auraGold)" stroke-width="2" fill="rgba(255, 159, 28, 0.1)" stroke-linejoin="round" />
    <!-- Precision Facets -->
    <line x1="32" y1="10" x2="32" y2="54" stroke="url(#auraGold)" stroke-width="1.6" />
    <line x1="13" y1="21" x2="51" y2="43" stroke="url(#auraGold)" stroke-width="1.4" opacity="0.85" />
    <line x1="13" y1="43" x2="51" y2="21" stroke="url(#auraGold)" stroke-width="1.4" opacity="0.85" />
    <polygon points="32,22 42,32 32,42 22,32" stroke="url(#auraGold)" stroke-width="1.8" fill="rgba(255, 209, 102, 0.35)" />
    <!-- Core Luminous Node -->
    <circle cx="32" cy="32" r="3.5" fill="#ffffff" />
  </g>
</svg>
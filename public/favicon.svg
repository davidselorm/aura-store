<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="auraGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#00f0ff" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
    <linearGradient id="auraDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <filter id="neonBlur" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2" result="glow" />
      <feMerge>
        <feMergeNode in="glow" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Circular background badge -->
  <circle cx="32" cy="32" r="30" fill="url(#auraDark)" stroke="url(#auraGlow)" stroke-width="2" />
  
  <!-- Optical Prism Geometric Hexagon Emblem -->
  <g filter="url(#neonBlur)">
    <!-- Outer hexagon -->
    <polygon points="32,12 49,21.5 49,42.5 32,52 15,42.5 15,21.5" stroke="url(#auraGlow)" stroke-width="2" fill="rgba(56, 189, 248, 0.08)" stroke-linejoin="round" />
    <!-- Inner faceted geometry -->
    <line x1="32" y1="12" x2="32" y2="52" stroke="url(#auraGlow)" stroke-width="1.6" />
    <line x1="15" y1="21.5" x2="49" y2="42.5" stroke="url(#auraGlow)" stroke-width="1.3" opacity="0.85" />
    <line x1="15" y1="42.5" x2="49" y2="21.5" stroke="url(#auraGlow)" stroke-width="1.3" opacity="0.85" />
    <polygon points="32,23 41,32 32,41 23,32" stroke="url(#auraGlow)" stroke-width="1.6" fill="rgba(0, 240, 255, 0.25)" />
    <!-- Core luminous star -->
    <circle cx="32" cy="32" r="3" fill="#ffffff" />
  </g>
</svg>